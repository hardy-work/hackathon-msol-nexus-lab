project: nexus
default_visibility: internal

# Identity/role are supplied by the trusted gateway (SSO, bot identity mapping,
# or service environment), never copied from free-form user input.
visibility_roles:
  public: []
  internal: [project_member, project_manager, knowledge_admin]
  restricted: [project_manager, knowledge_admin]

coverage_permissions:
  person_role: project_knowledge:approve_coverage
  person_task: project_knowledge:approve_coverage

# Ingest is a write-like action. The trusted NexusBot supplies the requester's
# Slack user ID; free-form message text and display names never grant permission.
# This allowlist is the only gate for starting a knowledge ingest.
