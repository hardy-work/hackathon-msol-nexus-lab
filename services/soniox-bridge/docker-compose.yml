services:
  soniox-bridge:
    build: .
    ports:
      - "${BRIDGE_PORT:-8083}:8000"
    environment:
      - SONIOX_API_KEY=${SONIOX_API_KEY}
      - API_TOKEN=${API_TOKEN}
      - SONIOX_MODEL=${SONIOX_MODEL:-stt-rt-v5}
      - SONIOX_WS_URL=${SONIOX_WS_URL:-wss://stt-rt.soniox.com/transcribe-websocket}
      - SONIOX_TIMEOUT_S=${SONIOX_TIMEOUT_S:-22}
      # Async/batch lane for long windows (long-monologue tail-loss fix). Defaults live in
      # main.py; override here to tune. Set SONIOX_ASYNC_OVER_BYTES huge to revert to pure realtime.
      - SONIOX_ASYNC_MODEL=${SONIOX_ASYNC_MODEL:-stt-async-v5}
      - SONIOX_ASYNC_OVER_BYTES=${SONIOX_ASYNC_OVER_BYTES:-800000}
      - SONIOX_ASYNC_TIMEOUT_S=${SONIOX_ASYNC_TIMEOUT_S:-25}
      - SONIOX_ASYNC_POLL_MS=${SONIOX_ASYNC_POLL_MS:-400}
      # How fast the CONFIRMED transcript (top list) catches up to the interim
      # "đang nghe" line. Defaults live in main.py; override here to tune.
      # Lower = faster but more prone to cutting a sentence mid-thought (Soniox
      # itself needs ~1-1.5s to commit a token as final, so don't go far below that).
      - STREAM_IDLE_FLUSH_MS=${STREAM_IDLE_FLUSH_MS:-2500}
      - STREAM_SEG_GAP_MS=${STREAM_SEG_GAP_MS:-900}
      # B1 low-latency interim push (opt-in). Empty -> disabled (reverts).
      - LIVE_INGEST_URL=${LIVE_INGEST_URL:-}
      - LIVE_INGEST_TOKEN=${LIVE_INGEST_TOKEN:-}
      # Soniox-native realtime translation (opt-in, no extra cost — included in
      # STT pricing). Empty -> off, live-translate's Claude-based translation
      # stays the sole path (unchanged behavior). Set e.g. "vi" to translate
      # every channel into Vietnamese directly in the Soniox stream — this is
      # what actually fixed the multi-second translation lag, not a tuning knob.
      - TRANSLATE_TARGET_LANG=${TRANSLATE_TARGET_LANG:-}
    restart: unless-stopped
