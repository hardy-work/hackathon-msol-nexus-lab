name: Project Knowledge checks

on:
  pull_request:
    paths:
      - "openclaw-skills/project-knowledge/**"
      - ".github/workflows/project-knowledge.yml"
  push:
    branches: [main]
    paths:
      - "openclaw-skills/project-knowledge/**"
      - ".github/workflows/project-knowledge.yml"

jobs:
  offline-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: openclaw-skills/project-knowledge/requirements.txt
      - name: Install skill dependencies
        run: python -m pip install -r openclaw-skills/project-knowledge/requirements.txt
      - name: Run intake to re-ingest to Gate 3a to derive
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PROJECT_KNOWLEDGE_EMBEDDING_BACKEND: "hash"
        run: python openclaw-skills/project-knowledge/scripts/ingest_flow_selftest.py
      - name: Run Gate 3a history metadata contract
        run: python openclaw-skills/project-knowledge/scripts/lint_history_selftest.py
      - name: Run Gate 3b consensus contract
        run: python openclaw-skills/project-knowledge/scripts/review_selftest.py
      - name: Run read-only filesystem boundary contract
        run: python openclaw-skills/project-knowledge/scripts/filesystem_boundary_selftest.py
      - name: Run deterministic Nexus demo
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PROJECT_KNOWLEDGE_EMBEDDING_BACKEND: "hash"
          PROJECT_KNOWLEDGE_COVERAGE_GRANTS: '{"Đô":["project_knowledge:approve_coverage"]}'
          PROJECT_KNOWLEDGE_APPROVAL_IDS: "nexus-demo-person-role-20260803,nexus-demo-person-task-20260803"
        run: bash openclaw-skills/project-knowledge/demo/run_demo.sh
      - name: Run Slack-shaped adapter demo
        run: bash openclaw-skills/project-knowledge/demo/run_slack_demo.sh
